<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SQUAT CLUB 深蹲俱樂部</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Firebase (Realtime Database) — 用來讓大家的打卡狀態即時同步 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Archivo+Black&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#EFE7D4;
    --card:#F6F0DF;
    --ink:#221C14;
    --stamp-red:#B23A2C;
  }
  body{
    background:var(--cream);
    font-family:'Noto Serif TC', serif;
    color:var(--ink);
  }
  .font-display{ font-family:'Archivo Black','Noto Serif TC',sans-serif; }
  .font-mono{ font-family:'DM Mono', monospace; }
  .vertical-text{
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 0.15em;
  }
  .stamp-enter{
    animation: stampIn 0.35s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes stampIn{
    0%{ transform: scale(2.2) rotate(-18deg); opacity:0; }
    60%{ transform: scale(0.9) rotate(-10deg); opacity:1; }
    100%{ transform: scale(1) rotate(-10deg); opacity:1; }
  }
  .card-shadow{
    box-shadow: 4px 6px 0px 0px rgba(34,28,20,0.9);
  }
  .dashed-hover:hover{
    background-color: rgba(178,58,44,0.06);
  }
</style>
</head>
<body class="min-h-screen pb-10">

  <!-- Phone status bar (decorative, matches reference) -->
  <div class="flex items-center justify-between px-5 pt-3 pb-1 text-[13px] font-mono text-[var(--ink)]">
    <span id="statusClock" class="font-semibold"></span>
    <div class="flex items-center gap-2">
      <span>●●●</span>
      <span>95%</span>
    </div>
  </div>

  <!-- Header -->
  <header class="px-5 pt-3">
    <div class="flex items-center justify-center gap-2 mb-6">
      <span class="text-[var(--stamp-red)] font-mono text-xs tracking-widest">SQUAT CLUB</span>
      <h1 class="text-lg font-bold tracking-wide">深蹲俱樂部</h1>
      <span class="text-[11px] text-[var(--ink)]/50 font-mono">同甘共蹲・est. 2026</span>
    </div>

    <!-- Date circle -->
    <div class="flex flex-col items-center mb-6">
      <div class="w-28 h-28 rounded-full border-2 border-[var(--stamp-red)] flex flex-col items-center justify-center">
        <span id="dateNum" class="font-display text-5xl leading-none"></span>
        <span id="dateMonth" class="text-sm mt-1"></span>
      </div>
      <span id="dateWeekday" class="text-[var(--stamp-red)] text-sm mt-2 font-semibold"></span>
    </div>

    <!-- Today mission bar -->
    <div class="bg-[var(--ink)] text-[var(--cream)] rounded-lg py-3 px-4 flex items-center justify-center gap-3 mb-6 card-shadow">
      <span class="text-amber-300 text-sm tracking-widest">今日任務</span>
      <span class="w-px h-4 bg-[var(--cream)]/30"></span>
      <span class="text-base tracking-wide">深蹲 <span class="font-display">10</span> 下</span>
    </div>
  </header>

  <!-- Card list -->
  <main id="cardList" class="px-5 flex flex-col gap-5"></main>

  <script>
    // ---------- Status bar clock ----------
    (function initClock(){
      const clockEl = document.getElementById('statusClock');
      function updateClock(){
        const d = new Date();
        let h = d.getHours();
        const m = String(d.getMinutes()).padStart(2, '0');
        clockEl.textContent = `${h}:${m}`;
      }
      updateClock();
      setInterval(updateClock, 1000); // 每秒檢查一次，分鐘變動時畫面會跟著更新
    })();

    // ---------- Date header ----------
    (function initDate(){
      const zhWeekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
      const zhMonths = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
      const now = new Date();
      document.getElementById('dateNum').textContent = now.getDate();
      document.getElementById('dateMonth').textContent = zhMonths[now.getMonth()];
      document.getElementById('dateWeekday').textContent = zhWeekdays[now.getDay()];
    })();

    // ---------- Firebase 設定 ----------
    const firebaseConfig = {
      apiKey: "AIzaSyCoPdRrjoxLKA-IMALuHJtK08zOYXKG4TY",
      authDomain: "squat-975f7.firebaseapp.com",
      databaseURL: "https://squat-975f7-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "squat-975f7",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 用「今天日期」當作打卡紀錄的節點，這樣每天的打卡狀態會自動分開存放
    function todayKey(){
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    const dayRef = db.ref('checkins/' + todayKey());

    function nowTime(){
      const d = new Date();
      const hh = String(d.getHours()).padStart(2,'0');
      const mm = String(d.getMinutes()).padStart(2,'0');
      return `${hh}:${mm}`;
    }

    // ---------- 朋友名單（顏色、目標次數固定寫在這裡；打卡狀態存在 Firebase） ----------
    const membersBase = [
      { name: 'Debby', color: '#B23A2C', goal: 10 },
      { name: '阿簡', color: '#3C6E52', goal: 20 },
      { name: '邱', color: '#3A5A8C', goal: 10 },
      { name: '南山', color: '#C9792F', goal: 10 },
      { name: 'Eric', color: '#8B3A3A', goal: 10 },
      { name: '莊哥', color: '#4A6B7C', goal: 10 },
    ];

    const list = document.getElementById('cardList');
    const cardRefs = {}; // name -> { statusEl, stampZone, inputEl }

    function createCardSkeleton(member){
      const card = document.createElement('div');
      card.className = 'flex rounded-xl overflow-hidden border-2 border-[var(--ink)] bg-[var(--card)] card-shadow';

      card.innerHTML = `
        <!-- left color bar with vertical name -->
        <div class="w-16 flex items-center justify-center py-4 shrink-0" style="background:${member.color}">
          <span class="vertical-text text-[var(--cream)] font-bold text-lg">${member.name}</span>
        </div>

        <!-- middle content -->
        <div class="flex-1 py-4 px-4 flex flex-col gap-2 justify-center">
          <input
            type="text"
            placeholder="嗆一句…"
            class="quote-input w-full bg-transparent border border-dashed border-[var(--ink)]/40 rounded-full px-3 py-1.5 text-sm placeholder-[var(--ink)]/40 focus:outline-none focus:border-[var(--stamp-red)]"
          />
          <div>
            <span class="inline-block border border-[var(--ink)] rounded-full px-4 py-1 text-sm font-semibold">
              深蹲 ${member.goal}
            </span>
          </div>
          <p class="status-text text-sm text-[var(--ink)]/60"></p>
        </div>

        <!-- right stamp zone -->
        <div class="stamp-zone w-28 flex items-center justify-center shrink-0 cursor-pointer select-none"></div>
      `;

      const statusEl = card.querySelector('.status-text');
      const stampZone = card.querySelector('.stamp-zone');
      const inputEl = card.querySelector('.quote-input');

      // 點蓋章 → 寫入 Firebase（畫面不用自己更新，onValue 監聽器收到變化會自動重繪）
      stampZone.addEventListener('click', () => {
        dayRef.child(member.name).update({
          checked: true,
          time: nowTime(),
        });
      });

      // 打字打完（失焦）才把「嗆一句」寫進 Firebase，避免每打一個字就送出一次請求
      inputEl.addEventListener('blur', () => {
        dayRef.child(member.name).update({ quote: inputEl.value });
      });

      cardRefs[member.name] = { statusEl, stampZone, inputEl };
      return card;
    }

    // 依照 state（來自 Firebase）畫出單一朋友的卡片內容
    function renderCardState(member, state){
      const { statusEl, stampZone, inputEl } = cardRefs[member.name];
      const checked = !!(state && state.checked);

      // 狀態文字
      if(checked){
        statusEl.innerHTML = `<button class="cancel-btn underline underline-offset-2 hover:text-[var(--stamp-red)] transition-colors">蓋錯了？取消打卡</button>`;
        statusEl.querySelector('.cancel-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          dayRef.child(member.name).update({ checked: false, time: null });
        });
      } else {
        statusEl.textContent = '尚未打卡';
      }

      // 蓋章區域
      if(checked){
        stampZone.innerHTML = `
          <div class="stamp-enter flex flex-col items-center">
            <div class="w-20 h-20 rounded-full border-4 border-[var(--stamp-red)] flex flex-col items-center justify-center -rotate-12">
              <span class="text-[var(--stamp-red)] font-display text-base leading-none">達成</span>
              <span class="text-[var(--stamp-red)] font-mono text-[10px] tracking-widest mt-1">SQUAT!</span>
            </div>
            <span class="text-[var(--stamp-red)] font-mono text-xs mt-1">${state.time || ''} 蓋章</span>
          </div>
        `;
      } else {
        stampZone.innerHTML = `
          <div class="dashed-hover w-20 h-20 rounded-full border-2 border-dashed border-[var(--ink)]/40 flex flex-col items-center justify-center transition-colors">
            <span class="text-[var(--ink)]/50 text-sm font-semibold">蓋章</span>
            <span class="text-[var(--ink)]/40 text-[11px] mt-0.5">按此打卡</span>
          </div>
        `;
      }

      // 「嗆一句」的輸入框：只有在使用者目前沒有正在打字時才覆蓋，避免打字被中斷
      if(document.activeElement !== inputEl){
        inputEl.value = (state && state.quote) || '';
      }
    }

    // 先把卡片骨架畫出來
    membersBase.forEach(m => list.appendChild(createCardSkeleton(m)));

    // 監聽 Firebase：只要有人打卡、取消、或改嗆聲內容，所有人畫面都會即時更新
    dayRef.on('value', (snapshot) => {
      const data = snapshot.val() || {};
      membersBase.forEach(m => {
        renderCardState(m, data[m.name]);
      });
    });
  </script>
</body>
</html>
